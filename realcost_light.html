<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Real Cost Estimating Inc — Glassmorphism Editorial</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,300&display=swap" rel="stylesheet"/>
<style>
/* ═══════════════════════════════════════════════════════════
   PREMIUM COLOUR SYSTEM — Heading font: Inter 800
   Nav/bg dark  : #0B0F1C   (near-black navy)
   Surface      : #111827   (deep ink)
   Accent blue  : #2D6BE4   (royal electric blue — elevated from old purple)
   Accent gold  : #C89B3C   (antique gold — premium signal)
   Red/danger   : #B03030   (deep crimson — premium, not flat)
   White        : #F7F8FC
   Muted        : #8A92A6
   Border dark  : rgba(255,255,255,.07)
   Border light : #E3E8F4
   Card bg      : #161C2D
   Card hover   : #1C2438
════════════════════════════════════════════════════════════ */
:root{
  /* ── Glassmorphism Editorial · Deep Sapphire + Champagne Gold ── */
  --sap:#0F2557;       --sap2:#1E3A7B;      --sap3:#2A508F;
  --gold:#C9A84C;      --gold2:#DFC06A;     --gold3:#F0D98A;
  --n:#0A1428;         --surf:#0F1E3A;      --card:#162244;    --card2:#1C2C52;
  --blue:var(--sap);   --blue2:var(--sap2); --blight:#EAF0FF;  --bdim:rgba(15,37,87,.14);
  --red:#B03030;       --red2:#D04040;      --rlight:#FDEAEA;
  --green:#1A5C3A;     --gn2:#22754A;       --gnlight:#E4F5EC;
  --white:#F8F9FF;     --muted:#7A84A0;     --bd:rgba(255,255,255,.07);
  --bdl:#DCE2F0;       --dark:var(--n);     --txt:#0E1830;
  --grd-sap: linear-gradient(135deg,#0F2557 0%,#1E3A7B 100%);
  --grd-gold: linear-gradient(135deg,#C9A84C 0%,#E0C06A 100%);
  --grd-hero: linear-gradient(135deg,#0F2557 0%,#1E3A7B 60%,#2A508F 100%);
  --glass-bg: rgba(255,255,255,.72);
  --glass-border: rgba(255,255,255,.55);
  --glass-shadow: 0 8px 32px rgba(15,37,87,.12);
  /* backward compat aliases */
  --grd-blue: var(--grd-sap);
  --bdl:#DCE2F0;
}
*{font-family:'Plus Jakarta Sans',sans-serif!important;box-sizing:border-box;margin:0;padding:0}
body{background:var(--white);color:var(--txt);-webkit-font-smoothing:antialiased;}

/* ── scrollbar ── */
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:#EEF2FF}::-webkit-scrollbar-thumb{background:var(--sap);border-radius:3px}

/* ════════════════════ NAV ════════════════════ */
.rc-nav{
  background:rgba(248,249,255,.94);
  backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);
  height:68px;position:sticky;top:0;z-index:999;
  border-bottom:1px solid rgba(220,226,240,.8);
  display:flex;align-items:center;
  padding:0 80px;gap:0;
  box-shadow:0 2px 28px rgba(15,37,87,.07);
}

</style>
